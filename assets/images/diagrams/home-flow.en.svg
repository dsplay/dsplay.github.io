<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a media gets on screen</title><desc id="d">A media (its type and data), an HTML template and the template variables go to the player, which renders them on the screen.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs>
<rect width="900" height="230" rx="10" fill="#ffffff"/>
<rect x="24" y="24" width="230" height="56" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="139.0" y="49.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Media</text><text x="139.0" y="69.0" text-anchor="middle" font-size="12" fill="#5c7270">a type + its data</text><path d="M254 52 H300" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="24" y="96" width="230" height="56" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="139.0" y="121.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Template</text><text x="139.0" y="141.0" text-anchor="middle" font-size="12" fill="#5c7270">HTML, CSS, JS</text><path d="M254 124 H300" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="24" y="168" width="230" height="56" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="139.0" y="193.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Variables</text><text x="139.0" y="213.0" text-anchor="middle" font-size="12" fill="#5c7270">set in the CMS</text><path d="M254 196 H300" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M300 52 V196" stroke="#0f766e" stroke-width="2" fill="none"/><line x1="300" y1="124" x2="360" y2="124" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="364" y="84" width="200" height="80" rx="8" fill="#fff4e5" stroke="#f0c58a" stroke-width="1.5"/><text x="464.0" y="121.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Player</text><text x="464.0" y="141.0" text-anchor="middle" font-size="12" fill="#5c7270">renders the template</text><line x1="564" y1="124" x2="640" y2="124" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="644" y="64" width="232" height="106" rx="6" fill="#0b1f1e" stroke="#0f766e" stroke-width="2"/><rect x="742.0" y="170" width="36" height="5" fill="#0f766e"/><rect x="730.0" y="175" width="60" height="5" rx="2" fill="#0f766e"/><text x="760.0" y="122.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Screen</text>
