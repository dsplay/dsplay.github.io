<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a JSON service reaches the screen</title><desc id="d">Your data goes through your endpoint, which returns JSON to the DSPLAY player, which gives it to your template as dsplay_media.result, rendered on the screen.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs>
<rect width="1000" height="160" rx="10" fill="#ffffff"/>
<rect x="16" y="40" width="150" height="70" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="91.0" y="72.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Your data</text><text x="91.0" y="92.0" text-anchor="middle" font-size="12" fill="#5c7270">API, database, sheet</text><rect x="222" y="40" width="150" height="70" rx="8" fill="#fff4e5" stroke="#f0c58a" stroke-width="1.5"/><text x="297.0" y="72.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Your endpoint</text><text x="297.0" y="92.0" text-anchor="middle" font-size="12" fill="#5c7270">returns JSON</text><rect x="428" y="40" width="150" height="70" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="503.0" y="72.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">DSPLAY player</text><text x="503.0" y="92.0" text-anchor="middle" font-size="12" fill="#5c7270">calls it and caches</text><rect x="634" y="40" width="150" height="70" rx="8" fill="#fff4e5" stroke="#f0c58a" stroke-width="1.5"/><text x="709.0" y="72.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Your template</text><text x="709.0" y="92.0" text-anchor="middle" font-size="12" fill="#5c7270">renders the result</text><rect x="840" y="36" width="144" height="66" rx="6" fill="#0b1f1e" stroke="#0f766e" stroke-width="2"/><rect x="894.0" y="102" width="36" height="5" fill="#0f766e"/><rect x="882.0" y="107" width="60" height="5" rx="2" fill="#0f766e"/><text x="912.0" y="74.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Screen</text><line x1="168" y1="75" x2="220" y2="75" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><line x1="374" y1="75" x2="426" y2="75" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><line x1="580" y1="75" x2="632" y2="75" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><line x1="786" y1="75" x2="838" y2="75" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><text x="400" y="28" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="600">GET</text><text x="606" y="28" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dsplay_media.result</text><text x="297" y="136" text-anchor="middle" font-size="12" fill="#5c7270" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ expiresAt, data }</text><text x="709" y="136" text-anchor="middle" font-size="12" fill="#5c7270" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">media.result.data</text>
</svg>
