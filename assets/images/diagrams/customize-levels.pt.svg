<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Duas formas de customizar um template do sistema</title><desc id="d">Nível 1: defina as variáveis de um template oficial no CMS. Nível 2: copie o código-fonte, altere, empacote e envie como um template seu.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs>
<rect width="760" height="312" rx="10" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f766e">Nível 1: ajuste</text><text x="24" y="50" text-anchor="start" font-size="12" fill="#5c7270" font-weight="400">sem código</text><rect x="24" y="66" width="180" height="60" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="114.0" y="101.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Template oficial</text><rect x="24" y="146" width="180" height="60" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="114.0" y="173.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Variáveis</text><text x="114.0" y="193.0" text-anchor="middle" font-size="12" fill="#5c7270">cores, logo, ...</text><path d="M204 96 H250 V146 H204" stroke="#0f766e" stroke-width="2" fill="none"/><line x1="250" y1="121" x2="298" y2="121" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="302" y="91" width="160" height="60" rx="8" fill="#fff4e5" stroke="#f0c58a" stroke-width="1.5"/><text x="382.0" y="126.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2b2b">Sua mídia</text><line x1="490" y1="20" x2="490" y2="296" stroke="#b7d3d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="516" y="30" font-size="16" font-weight="700" fill="#0f766e">Nível 2: copie</text><text x="516" y="50" text-anchor="start" font-size="12" fill="#5c7270" font-weight="400">altere o código</text><rect x="516" y="66" width="200" height="42" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="534" y="85" font-size="14" font-weight="600" fill="#1d2b2b">1. Copie o código</text><text x="534" y="101" font-size="11.5" fill="#5c7270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npx degit</text><line x1="616" y1="109" x2="616" y2="124" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="516" y="126" width="200" height="42" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="534" y="145" font-size="14" font-weight="600" fill="#1d2b2b">2. Altere o código</text><text x="534" y="161" font-size="11.5" fill="#5c7270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">seu editor</text><line x1="616" y1="169" x2="616" y2="184" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="516" y="186" width="200" height="42" rx="8" fill="#eef6f5" stroke="#b7d3d0" stroke-width="1.5"/><text x="534" y="205" font-size="14" font-weight="600" fill="#1d2b2b">3. Empacote</text><text x="534" y="221" font-size="11.5" fill="#5c7270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run zip</text><line x1="616" y1="229" x2="616" y2="244" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><rect x="516" y="246" width="200" height="42" rx="8" fill="#fff4e5" stroke="#f0c58a" stroke-width="1.5"/><text x="534" y="265" font-size="14" font-weight="600" fill="#1d2b2b">4. Envie</text><text x="534" y="281" font-size="11.5" fill="#5c7270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">um template seu</text>
</svg>
